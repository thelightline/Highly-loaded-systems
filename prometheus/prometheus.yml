global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres-primary'
    static_configs:
      - targets: ['postgres-exporter-primary:9187']
  - job_name: 'postgres-replica1'
    static_configs:
      - targets: ['postgres-exporter-replica1:9187']
  - job_name: 'postgres-replica2'
    static_configs:
      - targets: ['postgres-exporter-replica2:9187']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
