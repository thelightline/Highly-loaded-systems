worker_processes auto;
events { worker_connections 1024; }

http {
  log_format short '$remote_addr - $request $status $upstream_addr $upstream_status $request_time cache:$upstream_cache_status';
  access_log /var/log/nginx/access.log short;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=apicache:10m max_size=100m inactive=1m use_temp_path=off;
  map $http_cache_bypass $bypass { default 0; "1" 1; }

  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream backend_upstream  { 
    zone backend_zone 64k;
    server backend:8003 resolve; 
  }


  upstream products_upstream {
      zone products_zone 64k;
      server products-service:8002 resolve;
  }

  upstream users_v1 {
      zone users_v1 64k;
      server users-service:8001 resolve;
  }
  upstream users_v2 {
      zone users_v2 64k;
      server users-service-v2:8001 resolve;
  }

  map $arg_seed $canary_seed {
    "~.+"   $arg_seed;
    default "${remote_addr}${request_method}${uri}";
  }

  split_clients "$canary_seed" $canary {
    10%    v2;
    *      v1;
  }

  map $canary $users_upstream {
    v2       users_v2;
    default  users_v1;
  }

server {
    listen 80;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Access-Control-Expose-Headers "X-Canary,X-Service-Route,X-Cache-Status" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /healthz { return 200 "ok\n"; }

    location /api/users/ {
        rewrite ^/api/users/?(.*)$ /$1 break;
        proxy_pass http://$users_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        close;
        add_header X-Geo "zone-1" always;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        add_header X-Canary        $canary always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Expose-Headers "X-Canary,X-Service-Route,X-Cache-Status" always;
        add_header X-Service-Route $users_upstream always;
    }

    location = /api/admin/airdrop {
      proxy_pass http://backend_upstream/api/admin/airdrop;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header Access-Control-Allow-Origin  * always;
      add_header Access-Control-Allow-Methods GET,POST,OPTIONS always;
      add_header Access-Control-Allow-Headers * always;
      add_header Access-Control-Expose-Headers X-Canary,X-Service-Route,X-Cache-Status always;
      proxy_no_cache 1; proxy_cache_bypass 1; add_header X-Cache-Status off;
      if ($request_method = OPTIONS) { return 204; }
    }

    location /api/products/ {
      proxy_pass http://products_upstream/;
      proxy_no_cache 1; proxy_cache_bypass 1; add_header X-Cache-Status off;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Connection close;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;
      add_header Access-Control-Allow-Headers "*" always;
      add_header Access-Control-Expose-Headers "X-Canary,X-Service-Route,X-Cache-Status" always;
    }

    location /api/orders/ {
      rewrite ^/api/orders/?(.*)$ /$1 break;
      proxy_pass http://backend_upstream/;
      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 2;


      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods GET,POST,OPTIONS;
        add_header Access-Control-Allow-Headers *;
        add_header Access-Control-Expose-Headers X-Canary,X-Service-Route,X-Cache-Status;
        return 204;
      }
      add_header Access-Control-Allow-Origin  * always;
      add_header Access-Control-Allow-Methods GET,POST,OPTIONS always;
      add_header Access-Control-Allow-Headers * always;
      add_header Access-Control-Expose-Headers X-Canary,X-Service-Route,X-Cache-Status always;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header X-Cache-Status off;
    }
    

    location = /api/products/add_symbol {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods GET,POST,OPTIONS;
        add_header Access-Control-Allow-Headers *;
        add_header Access-Control-Expose-Headers X-Canary,X-Service-Route,X-Cache-Status;
        return 204;
      }
      proxy_pass http://products_upstream/add_symbol;
      add_header Access-Control-Allow-Origin  * always;
      add_header Access-Control-Allow-Methods GET,POST,OPTIONS always;
      add_header Access-Control-Allow-Headers * always;
      add_header Access-Control-Expose-Headers X-Canary,X-Service-Route,X-Cache-Status always;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header X-Cache-Status off;
    }

    location = /api/transactions {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods GET,POST,OPTIONS;
        add_header Access-Control-Allow-Headers *;
        add_header Access-Control-Expose-Headers X-Canary,X-Service-Route,X-Cache-Status;
        return 204;
      }

      proxy_pass http://backend_upstream/api/transactions;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header Access-Control-Allow-Origin  * always;
      add_header Access-Control-Allow-Methods GET,POST,OPTIONS always;
      add_header Access-Control-Allow-Headers * always;
      add_header Access-Control-Expose-Headers X-Canary,X-Service-Route,X-Cache-Status always;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header X-Cache-Status off;
    }

    location ~ ^/api/(orderbook|user/profile)$ {

      rewrite ^/api/?(.*)$ /$1 break;

      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header Connection        close;


      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header X-Cache-Status off;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;
      add_header Access-Control-Allow-Headers "*" always;
      add_header Access-Control-Expose-Headers "X-Canary,X-Service-Route,X-Cache-Status" always;
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
      proxy_next_upstream_tries 1;
    }

    location = /api/time {
      rewrite ^/api/?(.*)$ /$1 break;
      proxy_pass http://backend_upstream;
      proxy_cache apicache; proxy_cache_methods GET HEAD; proxy_cache_valid 200 5s; proxy_cache_bypass $bypass;
      add_header X-Cache-Status $upstream_cache_status;
      add_header X-Geo "zone-1" always;
      proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Connection close;
    }

    location = /api/whoami {
      proxy_pass http://backend_upstream/time;
      add_header X-Canary $canary always;
      add_header X-Service-Route $users_upstream always;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      proxy_set_header Connection close;
    }

    location /stub_status {
      stub_status;
      allow 127.0.0.1;
      allow 172.16.0.0/12;
      deny all;
    }
  }
}
